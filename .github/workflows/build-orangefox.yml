name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h
          nproc --all
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo git-core gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc fontconfig libncurses5 bc rsync lz4 \
            python3 python3-pip openjdk-17-jdk

      - name: Init OrangeFox source
        run: |
          mkdir -p ~/ofox && cd ~/ofox
          git config --global user.email "caghandeniz2013cd@outlook.com"
          git config --global user.name "caghandeniz"
          repo init --depth=1 --no-repo-verify -u https://gitlab.com/OrangeFox/Manifest.git -b fox-12.1

      - name: Add local manifest
        run: |
          mkdir -p ~/ofox/.repo/local_manifests
          cat > ~/ofox/.repo/local_manifests/local_manifest.xml << 'EOL'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="mygithub" fetch="https://github.com/" />
            <project name="caghandeniz/orangefox_device_ant_B2_Ultra" path="device/ant/B2_Ultra" remote="mygithub" revision="main" />
          </manifest>
          EOL

      - name: Repo sync
        timeout-minutes: 120
        run: |
          cd ~/ofox
          repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --fail-fast

      - name: Build OrangeFox
        run: |
          cd ~/ofox
          source build/envsetup.sh
          lunch fox_B2_Ultra-eng
          mka vendorbootimage

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-B2_Ultra
          path: ~/ofox/out/target/product/B2_Ultra/*.img
