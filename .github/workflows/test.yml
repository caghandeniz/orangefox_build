name: Disk check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
      - name: Disk status
        run: |
          df -h /
          free -h
          nproc --all
      - name: Estimate sync size
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          ls -la sync
